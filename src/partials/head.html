    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = localStorage.getItem('hv-theme');
          if (t) d.setAttribute('data-theme', t);
          if (sessionStorage.getItem('hv-transition')) {
            d.classList.add('pt-enter');
            sessionStorage.removeItem('hv-transition');
          } else if (!sessionStorage.getItem('hv-visited') && /^\/(index\.html)?$/.test(location.pathname)) {
            d.classList.add('pl-first');
          }
        } catch (e) {}
      })();
    </script>
